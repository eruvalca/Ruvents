<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6cbd" />
    <title>Connection required - Ruvents</title>
    <!-- Self-contained so this fallback needs neither Blazor nor additional network requests. -->
    <style>
        :root { font-family: var(--fontFamilyBase, system-ui, sans-serif); line-height: 1.5; color: CanvasText; background: Canvas; }
        body { margin: 0; padding: var(--spacingVerticalXXL, 2rem) var(--spacingHorizontalL, 1rem); }
        main { max-width: 36rem; margin-inline: auto; }
        h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.25; }
        a { color: var(--colorBrandForegroundLink, #0f6cbd); text-underline-offset: 0.15em; }
        a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Connection required</h1>
        <p>Ruvents could not reach the server. Check your connection and try again.</p>
        <p>This application requires a connection to load pages and use your account.</p>
        <p><a href="">Try again</a></p>
    </main>
</body>
</html>
